# Manual release: publish the net.hugmesh:hugmesh-parent metapom to GitHub Packages.
#
# workflow_dispatch ONLY. Switching this to `push: tags: ['v*']` would republish whatever
# version pom.xml happens to hold over an already-published, immutable coordinate — the
# failure mode that forced hugmesh-auth-core's 2.4.2 re-pin. Keep it manual.
#
# LINK 2 OF 4. The chain is
#   hugmesh-build-config 0.5.0 -> hugmesh-parent 2.8.0 -> hugmesh-commons 2.1.0
#     -> hugmesh-auth-core 2.5.1
# and hugmesh-auth-core/.github/workflows/release-chain.yml fires all four in that order
# from a single trigger. Running THIS workflow before hugmesh-build-config 0.5.0 is
# published fails at `verify`, on the analysers' ruleset jar, not at deploy.
# See RELEASING.md in this repo and hugmesh-auth-core/RELEASING.md sections 3.2 and 6.
name: Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25, matching this metapom's own <java.version>. It was pinned to 21 until
          # 2026-09-17 on the reasoning that pom packaging does not compile; that is true of
          # this project's (absent) sources but not of the toolchain the bound analyser
          # plugins load, and a metapom that publishes a Java 25 baseline from a Java 21
          # runner is a discrepancy nobody had verified either way. Aligned rather than
          # left as an open question.
          java-version: '25'
          # setup-java's generated ~/.m2/settings.xml is NOT what authenticates this build:
          # every mvn call below passes `-s .github/maven-ci-settings.xml`, and `-s`
          # replaces the user settings file. The servers that matter live in that file.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # -s .github/maven-ci-settings.xml is LOAD-BEARING: it is the only place
      # net.hugmesh:hugmesh-build-config:0.5.0 can be resolved from. It is not a project
      # dependency — it sits on the PMD/Checkstyle/SpotBugs PLUGIN classpaths, whose
      # executions are bound to `verify`, which runs before deploy even for pom packaging.
      # Deliberately not a <repositories> block in pom.xml: maven.pkg.github.com answers 401
      # to an unauthenticated GET, and this pom is the parent of the whole fleet.
      - name: Publish to GitHub Packages
        run: ./mvnw -B -ntp -s .github/maven-ci-settings.xml deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
