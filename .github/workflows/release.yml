# Release workflow: publish the net.hugmesh:hugmesh-parent metapom to GitHub Packages.
#
# WHAT PUBLISHES, AND WHEN (the beta scheme, 2026-10-21):
#   push of a tag v<version>      -> mvn verify, mvn deploy to GitHub Packages,
#                                    a cosign keyless signature and a GitHub
#                                    build-provenance attestation over the
#                                    published pom, then a GitHub Release
#                                    (with SHA256SUMS + signature; prerelease, never
#                                    "latest", while the version has a "-").
#   workflow_dispatch on a v* tag -> the same thing; this is the re-run path.
#   workflow_dispatch on main     -> mvn verify only. Nothing is deployed.
#   anything else                 -> the version job refuses and nothing runs.
# There is deliberately NO push-to-branch trigger and NO pull_request trigger. A Maven
# coordinate is immutable: publishing on every merge would try to redeploy whatever
# version pom.xml happens to hold over an already-published coordinate (the failure that
# forced hugmesh-auth-core's 2.4.2 re-pin). Only a person pushing a tag decides that a
# version is published. The tag must equal <version> in pom.xml with a leading "v", and it
# must point at a commit that is on main. scripts/test_release_workflow.py pins this shape.
#
# WHERE IT RUNS: every job uses the same runs-on line. It picks the repository variable
# RUNS_ON_PUBLISH (a JSON array such as ["self-hosted","Linux","X64"]) only for a non-PR
# event on main or on a v*/studio-v* tag, and hosted ubuntu-latest in every other case,
# including when the variable is unset. Deleting RUNS_ON_PUBLISH is the off switch that
# sends publishing back to hosted runners. This line keeps OUR jobs off the local runner
# for PRs; it is not a security boundary against fork PRs (a fork's PR runs the fork's
# copy of the workflow file). The runner group settings are that boundary.
#
# LINK 2 OF 4. The chain is
#   hugmesh-build-config 0.6.0-beta.1 -> hugmesh-parent 2.9.0-beta.1
#     -> hugmesh-commons 2.2.0-beta.1 -> hugmesh-auth-core 2.6.0-beta.1
# and hugmesh-auth-core/.github/workflows/release-chain.yml can fire all four in that
# order; each link must be dispatched on its v* tag ref, or it only verifies. Running
# THIS workflow before hugmesh-build-config 0.6.0-beta.1 is published fails at `verify`,
# on the analysers' ruleset jar, not at deploy. The commons and auth-core versions in
# pom.xml are dependencyManagement entries only: a pom-packaged parent does not resolve
# them, so they do not have to exist when this link publishes.
# See RELEASING.md in this repo and hugmesh-auth-core/RELEASING.md sections 3.2 and 6.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.guard.outputs.version }}
      kind: ${{ steps.guard.outputs.kind }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version guard
        id: guard
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as E; v = E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version"); print(v.text.strip() if v is not None and v.text else "")')"
          if [ -z "$version" ]; then
            echo "::error::pom.xml has no <project><version>."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::pom.xml version $version is a SNAPSHOT; a published coordinate must be a release or a beta."
              exit 1 ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::pom.xml version $version is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match pom.xml version $version (expected tag v$version)."
                exit 1
              fi
              if ! git merge-base --is-ancestor HEAD origin/main; then
                echo "::error::tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main. Tag a commit on main."
                exit 1
              fi
              kind=release ;;
            refs/heads/main)
              kind=main ;;
            *)
              echo "::error::Release runs only on main (verify) or on a v<version> tag (publish), not on $GITHUB_REF."
              exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Version $version, run kind: $kind"

      - name: Repository checks (pom pins and this workflow's shape)
        run: python3 -m unittest discover -s scripts -v

  publish:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
      # The two below exist only for the signing steps after the deploy:
      # id-token for the keyless cosign signature and the attestation's
      # Sigstore certificate, attestations to store the provenance on GitHub.
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25, matching this metapom's own <java.version>. It was pinned to 21 until
          # 2026-09-17 on the reasoning that pom packaging does not compile; that is true of
          # this project's (absent) sources but not of the toolchain the bound analyser
          # plugins load.
          java-version: '25'
          # Every mvn call below passes `-s .github/maven-ci-settings.xml`, and `-s`
          # replaces the user settings file, so the settings setup-java generates are not
          # what authenticates this build. They are written under runner.temp, not ~/.m2:
          # on the self-hosted runner ~/.m2/settings.xml belongs to the operator.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ runner.temp }}

      # A fresh local Maven repository per run, under the runner's per-job temp directory.
      # On the self-hosted runner ~/.m2/repository is the operator's own, and it can hold
      # net.hugmesh artifacts installed by local builds that were never published. A
      # verify that resolved hugmesh-build-config from there would pass here and then fail
      # for every consumer. With this, the build sees only what the registries serve.
      - name: Use a per-run local Maven repository
        run: echo "MAVEN_REPO_LOCAL=$RUNNER_TEMP/m2-repository" >> "$GITHUB_ENV"

      # PREFLIGHT - CROSS-REPO PACKAGE READ. This step exists to stop ONE specific
      # misdiagnosis, and that is worth a whole step.
      #
      # The maven steps below resolve net.hugmesh artifacts published from OTHER
      # repositories. secrets.GITHUB_TOKEN is scoped to THIS repository, and GitHub does not
      # hand it cross-repository package access automatically: the build must present a
      # token carrying read:packages, which is the PACKAGES_READ_TOKEN secret (a classic
      # PAT with read:packages; decision 90a = B). Going public does not remove the need:
      # GitHub Packages Maven needs a token to read even a public package. If it is not
      # set, maven fails with
      #     Could not resolve net.hugmesh:hugmesh-build-config:jar:0.6.0-beta.1
      # which is the SAME string this repo's RELEASING.md and the comments below teach a
      # reader to interpret as "the upstream is not published yet". A reader who believes
      # that goes and re-publishes an upstream that is already there, and hits the same wall.
      #
      # So: probe the registries first, with the exact credential maven is about to use, and
      # name the failure correctly. A 200 proves this runner can READ that upstream's Maven
      # registry. It does NOT prove the exact version pinned in pom.xml exists - maven says
      # that, accurately, one step later.
      #
      # The one run of this preflight (2026-10-07, run 37699571478) stopped on the 404
      # branch with PACKAGES_READ_TOKEN unset.
      - name: Preflight - cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' }}
        run: |
          set -uo pipefail
          if [ "${HAS_PACKAGES_READ_TOKEN}" = "true" ]; then
            echo "read credential: secrets.PACKAGES_READ_TOKEN (operator-held PAT)"
          else
            echo "read credential: the automatic secrets.GITHUB_TOKEN (PACKAGES_READ_TOKEN is not set)."
            echo "That token is scoped to THIS repository and may not read the upstream packages."
            echo "Set the PACKAGES_READ_TOKEN secret (classic PAT, read:packages). If the probe"
            echo "below fails, it says so explicitly. RELEASING.md 6.2."
          fi
          rc=0
          for upstream in hugmesh-build-config; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished'. This runner's credential cannot read that repository's Maven registry. Fix: set the PACKAGES_READ_TOKEN repo secret (classic PAT, read:packages), or share the org secret of that name with this repository. See RELEASING.md 6.2."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). TWO causes look identical here, so do not guess: (a) nothing is published to that registry yet - publish that link first, chain order is build-config, parent, commons, auth-core; or (b) it IS published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything. See RELEASING.md 6.2."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified - do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

      # -s .github/maven-ci-settings.xml is LOAD-BEARING: it is the only place
      # net.hugmesh:hugmesh-build-config can be resolved from. It is not a project
      # dependency - it sits on the PMD/Checkstyle/SpotBugs PLUGIN classpaths, whose
      # executions are bound to `verify`, which runs before deploy even for pom packaging.
      # Deliberately not a <repositories> block in pom.xml: maven.pkg.github.com answers 401
      # to an unauthenticated GET, and this pom is the parent of the whole fleet.
      - name: Verify (the analysers load the build-config rulesets)
        run: ./mvnw -B -ntp -s .github/maven-ci-settings.xml -Dmaven.repo.local="$MAVEN_REPO_LOCAL" verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo READS use their own credential - see the settings file header
          # and RELEASING.md 6.2. Falls back to GITHUB_TOKEN when PACKAGES_READ_TOKEN is
          # unset; the preflight step above reports that case.
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: needs.version.outputs.kind == 'release'
        run: ./mvnw -B -ntp -s .github/maven-ci-settings.xml -Dmaven.repo.local="$MAVEN_REPO_LOCAL" deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      # --- signed-maven-20261028 ---
      # Everything below signs what the deploy step just published, from this
      # job, by content: the published files are copied under their GitHub
      # Packages file names, SHA256SUMS over them gets a cosign keyless
      # signature (Sigstore, GitHub OIDC) and every file gets a SLSA
      # build-provenance attestation stored by GitHub. SHA256SUMS and the
      # cosign bundle are attached to the GitHub Release, so a consumer can
      # check what the registry serves against a signed list. A run that
      # did not deploy (dispatch on main) signs nothing.
      - name: Collect the published files
        if: needs.version.outputs.kind == 'release'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release && mkdir release
          cp pom.xml "release/hugmesh-parent-$VERSION.pom"
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        if: needs.version.outputs.kind == 'release'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS (cosign keyless, GitHub OIDC) and check the signature
        # Keyless: the certificate is issued to THIS workflow file at THIS tag by
        # GitHub's OIDC issuer and logged in Sigstore's public transparency log.
        # The check right after uses the identity a consumer would use.
        if: needs.version.outputs.kind == 'release'
        working-directory: release
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Attest build provenance for every published file
        if: needs.version.outputs.kind == 'release'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: release/*

      - name: Keep SHA256SUMS and its signature for the GitHub Release
        if: needs.version.outputs.kind == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-signature
          path: |
            release/SHA256SUMS
            release/SHA256SUMS.sigstore.json
          if-no-files-found: error
          retention-days: 7


  github-release:
    needs: [version, publish]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      - name: Fetch SHA256SUMS and its signature from the publish job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-signature
          path: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as it is."
            exit 0
          fi
          flags=(--verify-tag)
          case "$VERSION" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "hugmesh-parent $VERSION" \
            --notes "Maven coordinate net.hugmesh:hugmesh-parent:$VERSION (pom), published to GitHub Packages (https://maven.pkg.github.com/hugmesh/hugmesh-parent). SHA256SUMS lists the published files; SHA256SUMS.sigstore.json is its cosign keyless signature (identity https://github.com/hugmesh/hugmesh-parent/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME, issuer https://token.actions.githubusercontent.com); each file also has a GitHub build-provenance attestation (gh attestation verify <file> --repo hugmesh/hugmesh-parent)." \
            "${flags[@]}" \
            release/SHA256SUMS release/SHA256SUMS.sigstore.json
